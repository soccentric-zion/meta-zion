# Zion kernel config fragment — Zynq UltraScale+ MPSoC (KV260 / KR260)
#
# Applied on top of the Xilinx BSP defconfig via linux-xlnx_%.bbappend
# (merge_config.sh). Every symbol below exists in the rel-v2025.2
# linux-xlnx 6.12 tree and was verified against the BSP defconfig, which
# leaves these features off:
#
#   * SPI_SPIDEV            — user-space SPI (spidev, /dev/spidev*) for
#                             PL-hosted SPI devices and HAL testing
#   * XILINX_AMS            — ZynqMP system monitor (voltage/temp) via IIO;
#                             surfaced to lm-sensors by SENSORS_IIO_HWMON
#   * SENSORS_IIO_HWMON     — hwmon adapter over IIO devices (lm-sensors)
#   * CRYPTO_DEV_XILINX_TRNG— ZynqMP true RNG (via PMU firmware) for
#                             kernel entropy (rng-tools / haveged feed)
#   * BLK_DEV_NVME          — PCIe NVMe storage (KR260/PL PCIe endpoints)
#   * CAN_MCP251X           — Microchip MCP2515 SPI CAN controller (PL)
#   * CAN_MCP251XFD         — Microchip MCP2517/2518 CAN-FD controller (PL)

CONFIG_SPI_SPIDEV=y
CONFIG_XILINX_AMS=y
CONFIG_SENSORS_IIO_HWMON=y
CONFIG_CRYPTO_DEV_XILINX_TRNG=y
CONFIG_BLK_DEV_NVME=y
CONFIG_CAN_MCP251X=m
CONFIG_CAN_MCP251XFD=m