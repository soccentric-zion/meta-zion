# Zion kernel config fragment — deployment-specific kernel features.
# Add CONFIG_* options here for a specific deployment.
#
# Example:
# CONFIG_SECURITY_APPARMOR=y
# CONFIG_CAN_MCP251X=m

# --- RPU (Cortex-R5F) remoteproc/rpmsg — Linux-side enablement ------------
# Loads/starts R5 firmware via /sys/class/remoteproc and provides the
# virtio/rpmsg transport for Linux<->RPU messaging. No firmware is shipped
# by meta-zion (see recipes-bsp/zion-rpu/files/README-RPU.md) — this only
# turns on the kernel-side plumbing so a real firmware image can be loaded
# later. ZYNQMP_R5_REMOTEPROC is the exact symbol name in AMD/Xilinx kernel
# trees at time of writing; verify against the fetched kernel source if a
# future rel-vXXXX.X bump renames it (do_kernel_configcheck warns, does not
# fail the build, on an unmatched fragment line).
CONFIG_REMOTEPROC=y
CONFIG_ZYNQMP_R5_REMOTEPROC=y
CONFIG_RPMSG=y
CONFIG_RPMSG_VIRTIO=y
CONFIG_RPMSG_CHAR=y
CONFIG_HWSPINLOCK=y

# --- PTP (IEEE 1588) hardware timestamping ---------------------------------
# Kernel PTP clock subsystem + hardware timestamp support in the Cadence
# MACB/GEM driver used by the ZynqMP PS Ethernet controllers. Consumed by
# zion-timesync-ptp (linuxptp), which is opt-in per deployment.
CONFIG_PTP_1588_CLOCK=y
CONFIG_MACB_USE_HWSTAMP=y

# --- Hardware TRNG ----------------------------------------------------------
# ZynqMP CSU hardware random number generator, exposed as /dev/hwrng and
# fed into the kernel entropy pool by rngd (see zion-services).
CONFIG_HW_RANDOM=y
CONFIG_HW_RANDOM_XILINX_PS=y
