globals:
{
    verbose      = true;
    loglevel     = 3;
    syslog       = false;
    no-downgrade = false;
    postupdatecmd = "/sbin/reboot";
};

identify:
{
    name              = "zion-k26";
    hardware-revision = "1.0";
};

download:
{
    retries = 3;
    timeout = 1800;        /* seconds */
};

security:
{
    public-key = "/etc/swupdate/swupdate-public.pem";
};